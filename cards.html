<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <title>Rond — Carré | Cards</title>
    <link rel="stylesheet" href="/cards.css" />
  </head>
  <body>
    <div class="page-alpfa"></div>

    <div class="preloader">
      <div class="preloader__items">
        <div class="preloader__item preloader__item1">
          <img class="preloader__item-img" src="/img1.jpeg" alt="" />
        </div>
        <div class="preloader__item preloader__item2">
          <img class="preloader__item-img" src="/img2.jpeg" alt="" />
        </div>
        <div class="preloader__item preloader__item3">
          <img class="preloader__item-img" src="/img3.jpeg" alt="" />
        </div>
        <div class="preloader__item preloader__item4">
          <img class="preloader__item-img" src="/img4.jpeg" alt="" />
        </div>
        <div class="preloader__item preloader__item5">
          <img class="preloader__item-img" src="/img5.jpeg" alt="" />
        </div>
        <div class="preloader__item preloader__item6">
          <img class="preloader__item-img" src="/img6.jpeg" alt="" />
        </div>
        <div class="preloader__item preloader__item7">
          <img class="preloader__item-img" src="/img7.jpeg" alt="" />
        </div>
      </div>
    </div>

    <div class="wrapper">
      <img class="main-bg" src="/img8.jpeg" alt="" />

      <nav class="navbar" aria-label="Main">
        <a class="navbar__logo" href="/">
          <img
            src="/RCS-Logotype-2026.avif"
            alt="Rond — Carré"
            width="160"
            height="48"
          />
        </a>
      </nav>

      <section class="cards-hero" aria-label="Intro">
        <h1 class="cards-hero__title">Cards</h1>
        <p class="cards-hero__lead">Clip-path card intro</p>
      </section>
    </div>

    <button class="replay" type="button" hidden>Replay</button>

    <script type="module" src="/cards.js"></script>
  </body>
</html>
